
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            font-family: Georgia, serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 15px;
        }

        /* Main Profile Card */
        .profile-card {
            width: 50%;
            max-width: 1050px;
            background-color: white;
            text-align: center;
            padding: 30px 45px 45px;
            border-radius: 65px;

            box-shadow:
                15px 10px 45px rgba(105, 50, 255, 0.5),
                15px 10px 45px rgba(105, 50, 255, 0.5),
                0px 20px 45px rgba(220, 60, 150, 0.3);
        }

        /* Student Avatar */
        .avatar {
            width: 300px;
            height: 300px;
            border-radius: 50%;
           
            margin: 0 auto 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 100px;
            box-shadow: 0px 10px 30px rgba(50, 100, 200, 0.3);
        }

        /* Main Heading */
        h1 {
            font-size: 65px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: black;
            margin-bottom: 10px;
        }

        /* Purple Underline */
        .underline {
            height: 5px;
            width: 100%;
            background-color: black;
            margin-bottom: 25px;
        }

        /* Motivational Quote */
        .quote {
            font-size: 38px;
            font-style: italic;
            line-height: 1.8;
            color: #111111;
            margin-bottom: 30px;
        }

        /* Horizontal Line */
        hr {
            border: none;
            height: 4px;
            background-color: #aaa5b5;
            margin-bottom: 20px;
        }

        /* Skills Heading */
        h2 {
            font-size: 55px;
            letter-spacing: 8px;
            margin-bottom: 15px;
        }

        /* Skills */
        .skills {
            font-size: 38px;
            word-spacing: 10px;
        }

        .skills span {
            margin: 0 15px;
        }

        /* Responsive Design */
        @media (max-width: 600px) {

            .profile-card {
                width: 10%;
                padding: 25px 18px;
                border-radius: 15px;
            }

            .avatar {
                width: 10px;
                height: 10px;
                font-size: 9px;
            }

            h1 {
                font-size: 32px;
                letter-spacing: 2px;
            }

            .underline {
                height: 6px;
            }

            .quote {
                font-size: 20px;
            }

            h2 {
                font-size: 32px;
                letter-spacing: 4px;
            }

            .skills {
                font-size: 19px;
                word-spacing: 0;
            }

            .skills span {
                margin: 0 4px;
            }
        }

    </style>
</head>

<body>

    <div class="profile-card">

        <!-- Student Avatar -->
        <div class="avatar">
            SKR
        </div>

        <!-- Heading -->
        <h1>Sarath Kumar Reddy</h1>

        <div class="underline"></div>

        <!-- Quote -->
        <p class="quote">
            Dream big, learn continuously,<br>
            and build a better tomorrow.
        </p>

        <hr>

        <!-- Skills -->
        <h2>Skills:</h2>

        <p class="skills">
            Python <span>•</span>
            SQL <span>•</span>
            Web Development
        </p>

    </div>

</body>
</html>
